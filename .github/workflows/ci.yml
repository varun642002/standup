name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        shell: bash
        run: for f in lib/*.mjs bin/*.mjs test/*.mjs; do node --check "$f"; done
      - name: Tests
        run: node test/smoke.mjs
      - name: CLI help renders
        run: node bin/standup.mjs --help
      - name: Runs with no transcripts
        run: node bin/standup.mjs --projects ./nope --no-git
